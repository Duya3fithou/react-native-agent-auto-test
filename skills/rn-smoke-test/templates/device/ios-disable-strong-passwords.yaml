# One-time iOS Simulator setup (iOS 18+): turn off "Suggest Strong Passwords".
# Otherwise the system "Use Strong Password?" sheet pops up on sign-up / change-password forms
# and swallows everything typed after the first character (it is not reachable by selectors).
# Run with: rnsmoke device-setup --platform ios
appId: com.apple.Preferences
name: "Device setup - disable strong password suggestions"
---
- launchApp:
    appId: com.apple.Preferences
    stopApp: true
- tapOn: "General"
- scrollUntilVisible:
    element: "AutoFill & Passwords"
    direction: DOWN
    timeout: 10000
- tapOn: "AutoFill & Passwords"
- extendedWaitUntil:
    visible:
      id: "SuggestStrongPasswordsToggle"
    timeout: 10000
- runFlow:
    when:
      visible:
        id: "SuggestStrongPasswordsToggle"
        checked: true
    commands:
      - tapOn:
          id: "SuggestStrongPasswordsToggle"
          point: "90%,50%"
- assertVisible:
    id: "SuggestStrongPasswordsToggle"
    checked: false
- stopApp: com.apple.Preferences
